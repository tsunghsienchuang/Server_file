name: Windows release end-to-end

on:
  push:
    branches: [codex/windows-release-e2e]

permissions:
  contents: read

concurrency:
  group: windows-release-e2e
  cancel-in-progress: true

jobs:
  released-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and extract the published Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'server-files-release'
          New-Item -ItemType Directory -Path $package | Out-Null
          $asset = 'Server-Files-1.2.4-Windows-x64.zip'
          $zip = Join-Path $package $asset
          $releaseUri = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/v1.2.4/$asset"
          Invoke-WebRequest -Uri $releaseUri -OutFile $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne '120e04b9a7b17cd2ba029e9b9356b7089c8d4ce97847e465a7980b8e52bb7121') { throw 'Released ZIP SHA-256 mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $package
          $launcher = Join-Path $package 'ServerFiles.exe'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'Released executable missing from ZIP' }
          "SERVER_FILES_RELEASE_EXE=$launcher" >> $env:GITHUB_ENV
          Write-Host 'Downloaded, verified, and extracted the published v1.2.4 x64 ZIP on Windows.'
      - name: Open the release and verify SSH password login in Edge
        shell: pwsh
        run: ./.github/e2e/run-release.ps1 -ExePath $env:SERVER_FILES_RELEASE_EXE
      - name: Attach Edge preview screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-edge-json-preview
          path: ${{ runner.temp }}/server-files-edge-preview.png
          if-no-files-found: error
          retention-days: 14

  released-windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 6
    steps:
      - name: Download, verify, and run the published Windows ARM64 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'Expected native Windows ARM64' }
          $package = Join-Path $env:RUNNER_TEMP 'server-files-release-arm64'
          New-Item -ItemType Directory -Path $package | Out-Null
          $asset = 'Server-Files-1.2.4-Windows-arm64.zip'
          $zip = Join-Path $package $asset
          $releaseUri = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/v1.2.4/$asset"
          Invoke-WebRequest -Uri $releaseUri -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '89a4047fbd717bb546aae545e874310f3eb7ffc3c255bb2f115a546c0865e9ed') { throw 'Released ZIP SHA-256 mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $package
          $launcher = Join-Path $package 'ServerFiles.exe'
          if ((& $launcher --version) -cne 'Server Files 1.2.4') { throw 'Unexpected launcher version' }
          if ((& $launcher --help) -notlike 'Run ServerFiles.exe*') { throw 'Unexpected launcher help' }
          Write-Host 'Downloaded, verified, extracted, and ran the published Server Files v1.2.4 ARM64 EXE on Windows ARM64.'
