        <path d="M184 169s5-5 9-5 9 5 9 5-5 5-9 5-9-5-9-5z" class="line-icon"/>
        <circle cx="193" cy="169" r="2" class="line-icon"/>
      </g>

      <g transform="translate(730 284)">
        <rect width="218" height="205" rx="13" fill="#1b2535" stroke="#3b4b61"/>
        <rect x="10" y="10" width="198" height="127" rx="9" fill="#182b41"/>
        <path d="M29 26v92h162M29 49h162m-162 23h162m-162 23h162M69 26v92m40-92v92m40-92v92" fill="none" stroke="#516d89" stroke-width=".8" opacity=".63"/>
        <path d="m29 105 24-12 23 2 21-19 24 7 22-24 19 5 29-22v76H29Z" fill="url(#plot)"/>
        <path d="m29 105 24-12 23 2 21-19 24 7 22-24 19 5 29-22" fill="none" stroke="#93d0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="143" cy="59" r="3" fill="#a5d9ff"/>
        <circle cx="191" cy="42" r="3" fill="#a5d9ff"/>
        <text x="13" y="160" class="filename">latency.png</text>
        <text x="13" y="181" class="muted">Image</text>
        <path d="M184 169s5-5 9-5 9 5 9 5-5 5-9 5-9-5-9-5z" class="line-icon"/>
        <circle cx="193" cy="169" r="2" class="line-icon"/>
      </g>

      <g transform="translate(961 284)">
        <rect width="217" height="205" rx="13" fill="#1b2535" stroke="#3b4b61"/>
        <rect x="10" y="10" width="197" height="127" rx="9" fill="#19202e"/>
        <text x="23" y="39" class="mono" fill="#a8ccff" font-size="12" font-weight="650"># Run summary</text>
        <text x="23" y="62" class="mono" fill="#d0deef" font-size="10">Checks passed.</text>
        <text x="23" y="81" class="mono" fill="#d0deef" font-size="10">- Collect timings</text>
        <text x="23" y="100" class="mono" fill="#d0deef" font-size="10">- Compare baselines</text>
        <path d="M23 117h93" stroke="#354359" stroke-width="1.2" stroke-linecap="round"/>
        <text x="13" y="160" class="filename">summary.md</text>
        <text x="13" y="181" class="muted">Markdown</text>
        <path d="M183 169s5-5 9-5 9 5 9 5-5 5-9 5-9-5-9-5z" class="line-icon"/>
        <circle cx="192" cy="169" r="2" class="line-icon"/>
      </g>

      <path d="M499 507h679" stroke="#39495f"/>
      <text x="499" y="528" class="muted">3 items</text>
    </g>
