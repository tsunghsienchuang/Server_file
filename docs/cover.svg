      <rect x="473" y="93" width="731" height="463" rx="20" fill="url(#window)" stroke="#4a5c75"/>
      <path d="M474 137h729" stroke="#46566c"/>
      <circle cx="496" cy="115" r="4" fill="#e48279"/>
      <circle cx="511" cy="115" r="4" fill="#e6b975"/>
      <circle cx="526" cy="115" r="4" fill="#7fc5a7"/>
      <text x="838.5" y="120" text-anchor="middle" class="window-label">Server Files</text>

      <rect x="499" y="156" width="679" height="61" rx="12" fill="#1b2434" stroke="#3b4a60"/>
      <path d="M517 174h18m-18 7h18m-18 7h12" class="line-icon"/>
      <text x="549" y="191" class="mono" fill="#ebf3ff" font-size="21" font-weight="600">/srv/workspace</text>
      <rect x="1130" y="169" width="33" height="32" rx="8" fill="#2d415d" stroke="#6589b4"/>
      <path d="M1140 178h4v4h-4zm7 0h4v4h-4zm-7 7h4v4h-4zm7 0h4v4h-4z" fill="#b1d3ff"/>

      <rect x="499" y="230" width="679" height="36" rx="8" fill="#181f2d" stroke="#36465c"/>
      <circle cx="517" cy="247" r="4.8" class="line-icon"/>
      <path d="m521 251 4 4" class="line-icon"/>
      <text x="533" y="253" class="muted">Search files</text>

      <g transform="translate(499 284)">
        <rect width="218" height="205" rx="13" fill="#1b2535" stroke="#3b4b61"/>
        <rect x="10" y="10" width="198" height="127" rx="9" fill="#25364d"/>
        <path d="M68 17h66l18 18v97H68z" fill="url(#paper)"/>
        <path d="M134 17v18h18" fill="#b2c9e8"/>
        <path d="M79 44h51m-51 9h34m-34 57h60m-60 7h44" stroke="#8aa5c4" stroke-width="2" stroke-linecap="round"/>
        <path d="M81 97V73h11v24zm14 0V62h11v35zm14 0V79h11v18zm14 0V68h11v29z" fill="#5585b9"/>
        <text x="13" y="160" class="filename">benchmark.pdf</text>
