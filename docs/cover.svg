<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title description">
  <title id="title">Server Files for macOS</title>
  <desc id="description">An illustration of a Mac connected to a remote host over SSH, with a file browser showing sample PDF, image, and Markdown covers in /srv/workspace.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1280" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101722"/>
      <stop offset="1" stop-color="#0b101a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(884 205) rotate(124) scale(588 512)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263b58" stop-opacity=".82"/>
      <stop offset="1" stop-color="#152234" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="492" y1="99" x2="1200" y2="565" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263042"/>
      <stop offset="1" stop-color="#181f2d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6faff"/>
      <stop offset="1" stop-color="#d7e5f8"/>
    </linearGradient>
    <linearGradient id="plot" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#76c1fc" stop-opacity=".44"/>
      <stop offset="1" stop-color="#76c1fc" stop-opacity=".03"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#a4bbd5" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="650" rx="25"/></clipPath>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
      .headline { fill: #f3f7ff; font-size: 61px; font-weight: 700; letter-spacing: -2.6px; }
      .subtitle { fill: #bac7da; font-size: 21px; font-weight: 450; }
      .node-label { fill: #cbd6e7; font-size: 13px; font-weight: 650; }
      .window-label { fill: #e2eaf7; font-size: 14px; font-weight: 650; }
      .filename { fill: #eaf1fb; font-size: 14px; font-weight: 650; }
      .muted { fill: #a4b4ca; font-size: 12px; }
      .line-icon { fill: none; stroke: #a7c3e5; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="650" fill="url(#canvas)"/>
    <rect width="1280" height="650" fill="url(#halo)"/>
    <path d="M669 0H1280V650H989C896 585 770 552 719 454c-53-102 26-254-50-454Z" fill="url(#grid)" opacity=".72"/>
    <path d="M486 545c154 83 447 104 739-43" fill="none" stroke="#7597be" stroke-opacity=".17"/>
    <path d="M475 570c182 72 482 91 753-45" fill="none" stroke="#7597be" stroke-opacity=".10"/>

    <g transform="translate(71 109)">
      <rect width="54" height="54" rx="15" fill="#a8caff"/>
      <path d="M11 16h32v22H11zM11 22h32M17 28l4 3-4 3m8 0h9" fill="none" stroke="#182b43" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="124" class="headline">Server Files</text>
      <text x="2" y="168" class="subtitle">Browse and preview remote files</text>
      <text x="2" y="198" class="subtitle">from your Mac over SSH.</text>
    </g>

    <g transform="translate(72 387)">
      <path d="M101 39h31m-6-5 6 5-6 5m103-5h31m-6-5 6 5-6 5" fill="none" stroke="#86a9d0" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
      <g>
