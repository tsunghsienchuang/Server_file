        <text x="47.5" y="60" text-anchor="middle" class="node-label">SSH tunnel</text>
      </g>
      <g transform="translate(260)">
        <rect width="111" height="78" rx="13" fill="#171f2d" stroke="#344459"/>
        <path d="M43 18h25v9H43zm0 13h25v9H43zm4-8h1m-1 12h1m12-12h4m-4 12h4" class="line-icon"/>
        <text x="55.5" y="60" text-anchor="middle" class="node-label">Remote host</text>
      </g>
    </g>

    <g>
